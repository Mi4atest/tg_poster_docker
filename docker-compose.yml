services:
  app:
    image: tg_poster_docker_app:latest
    build: .
    container_name: tg_poster_app
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1536m
    cpus: "2.0"
    pids_limit: 256
    tmpfs:
      - /tmp
      - /app/app/logs
    volumes:
      - ./media:/app/media
      - ./backups:/app/backups
      - ./.env:/app/.env
      - ./alembic.ini:/app/alembic.ini
      - ./migrations:/app/migrations
      # Корень проекта на хосте — только чтение (git ls-remote / версия)
      - .:/host_project:ro
    depends_on:
      - db
    networks:
      tg_poster_network:
        ipv4_address: 172.20.0.3
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8002
      - TG_POSTER_HOST_DIR=/host_project
      - TG_POSTER_BACKUPS_DIR=/app/backups
      - TG_POSTER_APP_IMAGE=tg_poster_docker_app:latest
      - TG_POSTER_BRANCH=${TG_POSTER_BRANCH:-Test_planner}

  db:
    image: postgres:14-alpine
    container_name: tg_poster_db
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 512m
    pids_limit: 128
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_DB=${DB_NAME:-tg_poster}
    networks:
      tg_poster_network:
        ipv4_address: 172.20.0.2

  nginx:
    image: nginx:alpine
    container_name: tg_poster_nginx
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    mem_limit: 256m
    pids_limit: 64
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/app/media:ro
    depends_on:
      - app
    networks:
      tg_poster_network:
        ipv4_address: 172.20.0.4
    ports:
      - "127.0.0.1:8080:80"

networks:
  tg_poster_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1420"
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
