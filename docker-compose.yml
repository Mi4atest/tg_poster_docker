services:
  app:
    image: tg_poster_docker_app:latest
    build: .
    container_name: tg_poster_app
    restart: always
    volumes:
      - ./media:/app/media
      - ./backups:/app/backups
      - ./.env:/app/.env
      - ./alembic.ini:/app/alembic.ini
      - ./migrations:/app/migrations
      - ./.cursor:/app/.cursor
      # Корень проекта на хосте — для git pull / update.sh из бота
      - .:/host_project
      - /var/run/docker.sock:/var/run/docker.sock
      # Docker CLI с хоста — в образе docker.io API 1.41, демон требует >= 1.44
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/bin/docker-compose:/usr/bin/docker-compose:ro
      # Монтирование кода для разработки (изменения применяются сразу без пересборки)
      - ./app:/app/app
      - ./main.py:/app/main.py
    depends_on:
      - db
    networks:
      tg_poster_network:
        ipv4_address: 172.20.0.3
    environment:
      # DATABASE_URL и токены — только из смонтированного .env (load_dotenv в приложении).
      # Явная подстановка ${DATABASE_URL} ломается при update из docker-compose v1 в updater.
      - API_HOST=0.0.0.0
      - API_PORT=8002
      - TG_POSTER_HOST_DIR=/host_project
      - TG_POSTER_APP_IMAGE=tg_poster_docker_app:latest
      - TG_POSTER_BRANCH=${TG_POSTER_BRANCH:-Test_planner}
      - TG_POSTER_DOCKER_BIN=/usr/bin/docker
      - TG_POSTER_DOCKER_COMPOSE_BIN=/usr/bin/docker-compose

  db:
    image: postgres:14-alpine
    container_name: tg_poster_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_DB=${DB_NAME:-tg_poster}
    networks:
      tg_poster_network:
        ipv4_address: 172.20.0.2
    # Порт базы данных наружу не публикуется

  nginx:
    image: nginx:alpine
    container_name: tg_poster_nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./media:/app/media
    depends_on:
      - app
    networks:
      tg_poster_network:
        ipv4_address: 172.20.0.4
    # Только localhost — снаружи HTTPS на хостовом nginx
    ports:
      - "127.0.0.1:8080:80"

networks:
  tg_poster_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
